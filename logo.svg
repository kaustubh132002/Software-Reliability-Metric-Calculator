<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield / Hexagon -->
  <polygon points="100,12 178,56 178,144 100,188 22,144 22,56" fill="url(#primaryGrad)" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Inner Circuit Grid Accent -->
  <polygon points="100,26 164,62 164,138 100,174 36,138 36,62" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>

  <!-- Reliability Pulse / EKG Wave (MTBF & Availability) -->
  <path d="M 40,105 L 70,105 L 82,72 L 98,138 L 112,88 L 122,118 L 132,105 L 160,105" fill="none" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Core Reliability Nodes -->
  <circle cx="82" cy="72" r="5" fill="#38bdf8" />
  <circle cx="98" cy="138" r="5" fill="#60a5fa" />
  <circle cx="112" cy="88" r="4.5" fill="#93c5fd" />
  <circle cx="100" cy="48" r="4" fill="#38bdf8" />

  <!-- Metric Formula Indicator Overlay -->
  <text x="100" y="162" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="2">SEQA MTBF</text>
</svg>
